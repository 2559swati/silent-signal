# Phase 15 frontend proxy: the browser talks SAME-ORIGIN only.
# /api/* -> backend:8000 (container-to-container, always reachable inside
# the Compose network, regardless of which host URL the user opened).
# Everything else serves the built SPA (nginx:alpine default root).
server {
  listen 80;
  server_name _;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 10s;
    proxy_read_timeout 120s;
  }

  location / {
    root /usr/share/nginx/html;
    index index.html;
    # SPA fallback: unknown paths serve index.html (hash routes still work).
    try_files $uri $uri/ /index.html;
  }
}
